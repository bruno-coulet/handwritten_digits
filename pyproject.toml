[project]
name = "handwritten-digits"
version = "0.1.0"
description = "End-to-end MNIST handwritten digit recognition with Keras/TensorFlow, MLflow, DagsHub, and Flask"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "numpy>=2.5.5",
    "pillow>=11.0.0",
    "tensorflow>=2.21.0",
]

[dependency-groups]
dev = [
    "dagshub>=0.7.3",
    "dvc>=3.67.1",
    "ipykernel>=7.4.0",
    "jupytext>=1.19.6",
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
    "pandas>=3.1.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.16.0",
    "ruff>=0.17.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    "**/*_old.py",
    "notebooks",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
]
ignore = [
    "E501",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
pythonpath = [
    "app",
]
